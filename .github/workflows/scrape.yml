name: Scheduled Lotto Scraper

on:
  schedule:
    # Run every 20 minutes to capture 2PM, 5PM, and 9PM draws in real-time
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to push results back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Scraper
        run: node scripts/scrape.js

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No changes in results.json"
          else
            git commit -m "chore: update lotto results [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
