name: Scheduled Lotto Scraper

on:
  schedule:
    # Run every 5 minutes during 2 PM, 5 PM, and 9 PM Manila draw hours (6 AM, 9 AM, 1 PM UTC)
    - cron: '*/5 6,9,13 * * *'
    # Run once an hour during other hours as a fallback
    - cron: '0 0-5,7-8,10-12,14-23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to push results back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Scraper
        run: node scripts/scrape.js

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No changes in results.json"
          else
            git commit -m "chore: update lotto results [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
